<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Document Analyzer</title>
    
    <!-- Tailwind CSS через CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React и ReactDOM через CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel для транспиляции JSX в браузере -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #root {
            height: 100vh;
            width: 100vw;
        }

        /* Кастомная прокрутка */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Анимация для thinking mode */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .animate-spin {
            animation: spin 1s linear infinite;
        }

        /* Анимация появления сообщений */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-fade-in {
            animation: fadeIn 0.3s ease-out;
        }

        /* Градиент для thinking box */
        .thinking-gradient {
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
        }

        /* Стили для кнопок при наведении */
        .hover-scale {
            transition: transform 0.2s;
        }

        .hover-scale:hover {
            transform: scale(1.05);
        }

        /* Тени для карточек */
        .card-shadow {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: box-shadow 0.3s;
        }

        .card-shadow:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Компонент Sidebar
        function Sidebar({ chats, setCurrentChat, createChat, deleteChat }) {
          return (
            <div className="w-64 bg-gray-800 text-white p-4 flex flex-col">
              <button
                onClick={createChat}
                className="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded mb-4 hover-scale"
              >
                + Новый чат
              </button>
              
              <div className="flex-1 overflow-y-auto">
                {chats.map((chat) => (
                  <div
                    key={chat.id}
                    className="flex items-center justify-between p-2 hover:bg-gray-700 rounded cursor-pointer mb-2 card-shadow"
                  >
                    <span
                      onClick={() => setCurrentChat(chat)}
                      className="flex-1 truncate"
                    >
                      Чат {new Date(chat.id).toLocaleString('ru-RU', {
                        day: '2-digit',
                        month: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit'
                      })}
                    </span>
                    <button
                      onClick={(e) => {
                        e.stopPropagation();
                        deleteChat(chat.id);
                      }}
                      className="text-red-400 hover:text-red-600 ml-2"
                    >
                      ✕
                    </button>
                  </div>
                ))}
              </div>
            </div>
          );
        }

        // Компонент ChatBox
        function ChatBox({ messages }) {
          return (
            <div className="flex-1 overflow-y-auto p-4 bg-gray-100">
              {messages.map((msg, idx) => {
                if (msg.role === "thinking") {
                  return (
                    <div
                      key={idx}
                      className="mb-4 p-4 rounded-lg max-w-xl mr-auto thinking-gradient border-l-4 border-purple-500 message-fade-in"
                    >
                      <div className="flex items-center mb-2">
                        <div className="animate-spin rounded-full h-4 w-4 border-b-2 border-purple-600 mr-2"></div>
                        <span className="font-semibold text-purple-700">Думаю...</span>
                      </div>
                      <div className="text-sm text-gray-700 space-y-1">
                        {msg.steps.map((step, i) => (
                          <div key={i} className="flex items-start">
                            <span className="mr-2">•</span>
                            <span>{step}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                }

                return (
                  <div
                    key={idx}
                    className={`mb-2 p-3 rounded-lg max-w-xl message-fade-in ${
                      msg.role === "user"
                        ? "bg-blue-500 text-white ml-auto text-right"
                        : "bg-white mr-auto text-left border border-gray-200 card-shadow"
                    }`}
                  >
                    {msg.text}
                  </div>
                );
              })}
            </div>
          );
        }

        // Компонент InputBar
        function InputBar({ addMessage }) {
          const [input, setInput] = useState("");
          const [file, setFile] = useState(null);
          const [isThinking, setIsThinking] = useState(false);

          const sendMessage = async () => {
            if (!input.trim() || isThinking) return;

            const userMessage = input;
            
            addMessage({ role: "user", text: userMessage });
            
            setInput("");
            setFile(null);
            setIsThinking(true);

            const thinkingSteps = [
              "Анализирую ваш запрос...",
              "Обрабатываю контекст разговора...",
              "Формулирую ответ..."
            ];

            addMessage({ 
              role: "thinking", 
              steps: thinkingSteps 
            });

            await new Promise(resolve => setTimeout(resolve, 2500));

            const fakeAnswer = `Бот ответил: "${userMessage}" (тестовый вывод)`;
            addMessage({ 
              role: "ai", 
              text: fakeAnswer,
              removeThinking: true 
            });

            setIsThinking(false);
          };

          const handleKeyPress = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
              e.preventDefault();
              sendMessage();
            }
          };

          return (
            <div className="flex gap-2 p-4 border-t bg-white">
              <input
                type="text"
                className="flex-1 border rounded p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                value={input}
                onChange={(e) => setInput(e.target.value)}
                onKeyPress={handleKeyPress}
                placeholder="Введите сообщение..."
                disabled={isThinking}
              />
              <label className={`px-4 py-2 rounded cursor-pointer transition-colors ${
                isThinking ? 'bg-gray-400 cursor-not-allowed' : 'bg-blue-500 hover:bg-blue-600'
              } text-white hover-scale`}>
                📎 Файл
                <input
                  type="file"
                  className="hidden"
                  onChange={(e) => setFile(e.target.files[0])}
                  disabled={isThinking}
                />
              </label>
              <button
                onClick={sendMessage}
                className={`px-4 py-2 rounded text-white transition-colors hover-scale ${
                  isThinking ? 'bg-gray-400 cursor-not-allowed' : 'bg-blue-500 hover:bg-blue-600'
                }`}
                disabled={isThinking}
              >
                {isThinking ? "Думаю..." : "Отправить"}
              </button>
            </div>
          );
        }

        // Главный компонент App
        function App() {
          const [chats, setChats] = useState(() => {
            const saved = localStorage.getItem("chats");
            return saved ? JSON.parse(saved) : [];
          });
          const [currentChat, setCurrentChat] = useState(null);

          useEffect(() => {
            localStorage.setItem("chats", JSON.stringify(chats));
          }, [chats]);

          const addMessage = (msg) => {
            if (!currentChat) {
              const newChat = { id: Date.now(), messages: [msg] };
              setChats([...chats, newChat]);
              setCurrentChat(newChat);
            } else {
              setCurrentChat(prevChat => {
                let updatedMessages = [...prevChat.messages];
                
                if (msg.removeThinking) {
                  updatedMessages = updatedMessages.filter(m => m.role !== "thinking");
                  delete msg.removeThinking;
                }
                
                updatedMessages.push(msg);
                
                const updatedChat = {
                  ...prevChat,
                  messages: updatedMessages,
                };
                
                setChats(prevChats => 
                  prevChats.map(c => c.id === updatedChat.id ? updatedChat : c)
                );
                
                return updatedChat;
              });
            }
          };

          const createChat = () => {
            const newChat = { id: Date.now(), messages: [] };
            setChats([...chats, newChat]);
            setCurrentChat(newChat);
          };

          const deleteChat = (id) => {
            setChats(chats.filter(c => c.id !== id));
            if (currentChat?.id === id) setCurrentChat(null);
          };

          return (
            <div className="flex h-screen">
              <Sidebar
                chats={chats}
                setCurrentChat={setCurrentChat}
                createChat={createChat}
                deleteChat={deleteChat}
              />
              <div className="flex flex-col flex-1">
                {currentChat ? (
                  <>
                    <ChatBox messages={currentChat.messages} />
                    <InputBar addMessage={addMessage} />
                  </>
                ) : (
                  <div className="flex-1 flex items-center justify-center text-gray-500">
                    <h2 className="text-xl">Добро пожаловать! Выберите или создайте чат.</h2>
                  </div>
                )}
              </div>
            </div>
          );
        }

        // Рендер приложения
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
