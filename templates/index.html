<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG СПЛАВ</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, sans-serif;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        @keyframes spin { 
            to { transform: rotate(360deg); } 
        }
        .animate-spin { animation: spin 1s linear infinite; }

        @keyframes slideInUp {
            from { 
                opacity: 0; 
                transform: translateY(20px) scale(0.95);
            }
            to   { 
                opacity: 1; 
                transform: translateY(0) scale(1);
            }
        }

        .message-slide-in {
            animation: slideInUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        .thinking-gradient {
            background: linear-gradient(135deg, #e0c3fc, #8ec5fc);
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .welcome-animation {
            animation: fadeInScale 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-size: 200% 200%;
            animation: gradientShift 8s ease infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .typing-cursor::after {
            content: '|';
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .copy-button {
            opacity: 0;
            transition: opacity 0.2s;
        }

        .message-container:hover .copy-button {
            opacity: 1;
        }

        @keyframes slideInLeft {
            from {
                transform: translateX(-100%);
            }
            to {
                transform: translateX(0);
            }
        }

        .slide-in-left {
            animation: slideInLeft 0.3s ease-out;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    {% raw %}
    <script type="text/babel">

        const { useState, useEffect, useRef } = React;

        // ---------------- Welcome Screen ----------------
        function WelcomeScreen({ onStart }) {
            return (
                <div className="fixed inset-0 gradient-bg flex items-center justify-center z-50">
                    <div className="welcome-animation bg-white rounded-2xl shadow-2xl p-12 max-w-2xl mx-4 text-center">
                        <div className="mb-6">
                            <div className="inline-block p-4 bg-gradient-to-r from-blue-500 to-purple-600 rounded-full mb-4">
                                <svg className="w-16 h-16 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                                </svg>
                            </div>
                            <h1 className="text-4xl font-bold text-gray-800 mb-2">RAG СПЛАВ</h1>
                            <p className="text-lg text-gray-600">Интеллектуальный ассистент с поддержкой RAG</p>
                        </div>
                        
                        <div className="mb-8 space-y-3 text-left">
                            <div className="flex items-start space-x-3">
                                <span className="text-2xl">🚀</span>
                                <div>
                                    <h3 className="font-semibold text-gray-800">Быстрые ответы</h3>
                                    <p className="text-gray-600 text-sm">Получайте точные ответы на основе ваших документов</p>
                                </div>
                            </div>
                            <div className="flex items-start space-x-3">
                                <span className="text-2xl">💬</span>
                                <div>
                                    <h3 className="font-semibold text-gray-800">Умные диалоги</h3>
                                    <p className="text-gray-600 text-sm">Контекстуальное общение с сохранением истории</p>
                                </div>
                            </div>
                            <div className="flex items-start space-x-3">
                                <span className="text-2xl">🔒</span>
                                <div>
                                    <h3 className="font-semibold text-gray-800">Безопасность</h3>
                                    <p className="text-gray-600 text-sm">Ваши данные надежно защищены</p>
                                </div>
                            </div>
                        </div>

                        <button
                            onClick={onStart}
                            className="bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 text-white font-semibold px-8 py-4 rounded-xl shadow-lg transform transition hover:scale-105"
                        >
                            Начать работу
                        </button>
                    </div>
                </div>
            );
        }

        // ---------------- Online Indicator ----------------
        function OnlineIndicator({ isOnline }) {
            return (
                <div className="flex items-center gap-2 px-3 py-2 bg-gray-700 rounded-lg mb-4">
                    <div className={`w-2 h-2 rounded-full ${isOnline ? 'bg-green-400 pulse' : 'bg-red-400'}`}></div>
                    <span className="text-xs text-gray-300">
                        {isOnline ? 'Сервер онлайн' : 'Сервер офлайн'}
                    </span>
                </div>
            );
        }

        // ---------------- Sidebar ----------------
        function Sidebar({ chats, setCurrentChat, currentChat, createChat, deleteChat, isOpen, setIsOpen }) {
            const [isOnline, setIsOnline] = useState(true);

            useEffect(() => {
                const checkServer = async () => {
                    try {
                        const res = await fetch("http://127.0.0.1:5000/api/health");
                        setIsOnline(res.ok);
                    } catch {
                        setIsOnline(false);
                    }
                };
                checkServer();
                const interval = setInterval(checkServer, 10000);
                return () => clearInterval(interval);
            }, []);

            return (
                <>
                    {/* Mobile backdrop */}
                    {isOpen && (
                        <div 
                            className="fixed inset-0 bg-black bg-opacity-50 z-40 lg:hidden"
                            onClick={() => setIsOpen(false)}
                        ></div>
                    )}

                    {/* Sidebar */}
                    <div className={`
                        ${isOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'}
                        fixed lg:relative z-50 w-64 bg-gray-800 text-white p-4 flex flex-col h-screen
                        transition-transform duration-300 ease-in-out
                    `}>
                        <div className="flex items-center justify-between mb-4">
                            <h2 className="text-xl font-bold">Чаты</h2>
                            <button
                                onClick={() => setIsOpen(false)}
                                className="lg:hidden text-gray-400 hover:text-white"
                            >
                                ✕
                            </button>
                        </div>

                        <OnlineIndicator isOnline={isOnline} />

                        <button
                            onClick={createChat}
                            className="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded mb-4 transition-colors duration-200"
                        >
                            + Новый чат
                        </button>

                        <div className="flex-1 overflow-y-auto">
                            {chats.map(chat => (
                                <div
                                    key={chat.id}
                                    className={`flex items-center justify-between p-2 rounded cursor-pointer mb-2 transition-colors duration-200 ${
                                        currentChat?.id === chat.id ? 'bg-gray-700' : 'hover:bg-gray-700'
                                    }`}
                                >
                                    <span
                                        onClick={() => {
                                            setCurrentChat(chat);
                                            setIsOpen(false);
                                        }}
                                        className="flex-1 truncate"
                                    >
                                        Чат {new Date(chat.id).toLocaleString('ru-RU')}
                                    </span>

                                    <button
                                        onClick={(e) => {
                                            e.stopPropagation();
                                            deleteChat(chat.id);
                                        }}
                                        className="text-red-400 hover:text-red-600 ml-2 transition-colors duration-200"
                                    >
                                        ✕
                                    </button>
                                </div>
                            ))}
                        </div>
                    </div>
                </>
            );
        }

        // ---------------- Typing Effect ----------------
        function TypingText({ text, speed = 20, onComplete }) {
            const [displayedText, setDisplayedText] = useState('');
            const [isTyping, setIsTyping] = useState(true);

            useEffect(() => {
                let index = 0;
                setDisplayedText('');
                setIsTyping(true);

                const interval = setInterval(() => {
                    if (index < text.length) {
                        setDisplayedText(text.slice(0, index + 1));
                        index++;
                    } else {
                        setIsTyping(false);
                        if (onComplete) onComplete();
                        clearInterval(interval);
                    }
                }, speed);

                return () => clearInterval(interval);
            }, [text, speed, onComplete]);

            return (
                <span className={isTyping ? 'typing-cursor' : ''}>
                    {displayedText}
                </span>
            );
        }

        // ---------------- ChatBox ----------------
        function ChatBox({ messages }) {
            const chatEndRef = useRef(null);
            const [copiedIndex, setCopiedIndex] = useState(null);

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [messages]);

            const copyToClipboard = (text, index) => {
                navigator.clipboard.writeText(text);
                setCopiedIndex(index);
                setTimeout(() => setCopiedIndex(null), 2000);
            };

            return (
                <div className="flex-1 overflow-y-auto p-4 bg-gray-100">

                    {messages.map((msg, idx) => {

                        if (msg.role === "thinking") {
                            return (
                                <div
                                    key={idx}
                                    className="mb-4 p-4 rounded-lg max-w-fit mr-auto thinking-gradient border-l-4 border-purple-500 message-slide-in"
                                >
                                    <div className="flex items-center mb-2">
                                        <div className="animate-spin rounded-full h-4 w-4 border-b-2 border-purple-600 mr-2"></div>
                                        <span className="font-semibold text-purple-700">Думаю...</span>
                                    </div>

                                    <div className="text-sm text-gray-700 space-y-1">
                                        {msg.steps.map((step, i) => (
                                            <div key={i} className="flex items-start">
                                                <span className="mr-2">•</span>
                                                <span>{step}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            );
                        }

                        return (
                            <div
                                key={idx}
                                className={`message-container relative mb-3 p-3 rounded-lg max-w-fit message-slide-in ${
                                    msg.role === "user"
                                        ? "bg-blue-500 text-white ml-auto shadow-md"
                                        : "bg-white mr-auto border border-gray-200 shadow-sm"
                                }`}
                            >
                                <div style={{whiteSpace: 'pre-line'}}>
                                    {msg.role === "ai" && msg.isNew ? (
                                        <TypingText 
                                            text={msg.text}
                                            onComplete={() => {
                                                // Помечаем сообщение как "не новое"
                                                msg.isNew = false;
                                                // Форсим перерисовку через обновление чата
                                                setCurrentChat(prev => ({ ...prev }));
                                            }}
                                        />
                                    ) : (
                                        msg.text
                                    )}
                                </div>

                                {msg.role === "ai" && !msg.isTyping && (
                                    <button
                                        onClick={() => copyToClipboard(msg.text, idx)}
                                        className="copy-button absolute top-2 right-2 p-1.5 bg-gray-100 hover:bg-gray-200 rounded transition-all"
                                        title="Копировать"
                                    >
                                        {copiedIndex === idx ? (
                                            <svg className="w-4 h-4 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />
                                            </svg>
                                        ) : (
                                            <svg className="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                                            </svg>
                                        )}
                                    </button>
                                )}
                            </div>
                        );
                    })}

                    <div ref={chatEndRef} />

                </div>
            );
        }

        // ---------------- Quick Actions ----------------
        function QuickActions({ currentChat, exportChat, clearChat }) {
            if (!currentChat) return null;

            return (
                <div className="flex gap-2 px-4 py-2 bg-gray-50 border-b">
                    <button
                        onClick={clearChat}
                        className="flex items-center gap-1 px-3 py-1.5 text-sm bg-white border border-gray-300 hover:bg-gray-100 rounded transition-colors"
                        title="Очистить чат"
                    >
                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                        Очистить
                    </button>

                    <button
                        onClick={exportChat}
                        className="flex items-center gap-1 px-3 py-1.5 text-sm bg-white border border-gray-300 hover:bg-gray-100 rounded transition-colors"
                        title="Экспорт чата"
                    >
                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                        Экспорт
                    </button>
                </div>
            );
        }

        // ---------------- InputBar ----------------
        function InputBar({ addMessage, currentChat, createChat }) {
            const [input, setInput] = useState("");
            const [isThinking, setIsThinking] = useState(false);

            const sendMessage = async () => {
                if (!input.trim() || isThinking) return;

                const userMessage = input;

                let chatId = currentChat?.id;
                if (!chatId) {
                    const created = await createChat();
                    chatId = created?.id;
                }

                addMessage({ role: "user", text: userMessage });
                setInput("");
                setIsThinking(true);

                addMessage({
                    role: "thinking",
                    steps: [
                        "Отправляю сообщение на сервер...",
                        "Жду ответ RAG...",
                        "Формирую вывод..."
                    ]
                });

                try {
                    const res = await fetch("http://127.0.0.1:5000/api/send_message", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ chat_id: chatId, message: userMessage })
                    });

                    const data = await res.json();

                    addMessage({
                        role: "ai",
                        text: data.reply,
                        isTyping: true,
                        isNew: true,
                        removeThinking: true
                    });
                } catch (error) {
                    addMessage({
                        role: "ai",
                        text: "Ошибка при получении ответа. Проверьте подключение к серверу.",
                        isTyping: false,
                        removeThinking: true
                    });
                }

                setIsThinking(false);
            };

            const handleKey = e => {
                if (e.key === "Enter" && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            };

            return (
                <div className="flex gap-2 p-4 border-t bg-white">
                    <input
                        type="text"
                        className="flex-1 border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
                        value={input}
                        onChange={e => setInput(e.target.value)}
                        onKeyDown={handleKey}
                        placeholder="Введите сообщение..."
                        disabled={isThinking}
                    />

                    <button
                        onClick={sendMessage}
                        disabled={isThinking}
                        className={`px-6 py-3 rounded-lg text-white font-medium transition-all duration-200 ${
                            isThinking ? "bg-gray-400 cursor-not-allowed" : "bg-blue-500 hover:bg-blue-600 transform hover:scale-105"
                        }`}
                    >
                        {isThinking ? "Думаю..." : "Отправить"}
                    </button>
                </div>
            );
        }

        // ---------------- App ----------------
        function App() {
            const [showWelcome, setShowWelcome] = useState(() => {
                const hasVisited = localStorage.getItem("hasVisited");
                return !hasVisited;
            });

            const [chats, setChats] = useState(() => {
                const saved = localStorage.getItem("chats");
                return saved ? JSON.parse(saved) : [];
            });

            const [currentChat, setCurrentChat] = useState(null);
            const [sidebarOpen, setSidebarOpen] = useState(false);

            useEffect(() => {
                localStorage.setItem("chats", JSON.stringify(chats));
            }, [chats]);

            const handleWelcomeStart = () => {
                localStorage.setItem("hasVisited", "true");
                setShowWelcome(false);
            };

            const addMessage = (msg) => {
                if (!currentChat) {
                    const newChat = { id: Date.now(), messages: [msg] };
                    setChats([...chats, newChat]);
                    setCurrentChat(newChat);
                } else {
                    setCurrentChat(prev => {
                        let updated = [...prev.messages];

                        if (msg.removeThinking) {
                            updated = updated.filter(m => m.role !== "thinking");
                            delete msg.removeThinking;
                        }

                        updated.push(msg);

                        const updatedChat = { ...prev, messages: updated };

                        setChats(chats =>
                            chats.map(c => (c.id === updatedChat.id ? updatedChat : c))
                        );

                        return updatedChat;
                    });
                }
            };

            const createChat = async () => {
                try {
                    const res = await fetch("http://127.0.0.1:5000/api/new_chat", {
                        method: "POST"
                    });

                    const data = await res.json();

                    const newChat = { id: data.chat_id, messages: [] };

                    setChats(prev => [...prev, newChat]);
                    setCurrentChat(newChat);
                    return newChat;
                } catch (error) {
                    console.error("Ошибка создания чата:", error);
                    return null;
                }
            };

            const deleteChat = async (id) => {
                try {
                    await fetch("http://127.0.0.1:5000/api/delete_chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ chat_id: id })
                    });

                    setChats(chats.filter(c => c.id !== id));
                    if (currentChat?.id === id) setCurrentChat(null);
                } catch (error) {
                    console.error("Ошибка удаления чата:", error);
                }
            };

            const exportChat = () => {
                if (!currentChat) return;
                
                const content = currentChat.messages
                    .filter(m => m.role !== "thinking")
                    .map(m => `${m.role === "user" ? "Вы" : "AI"}: ${m.text}`)
                    .join('\n\n');
                
                const blob = new Blob([content], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `chat-${new Date(currentChat.id).toLocaleDateString('ru-RU')}.txt`;
                a.click();
                URL.revokeObjectURL(url);
            };

            const clearChat = () => {
                if (!currentChat) return;
                if (confirm('Вы уверены, что хотите очистить этот чат?')) {
                    setCurrentChat(prev => ({ ...prev, messages: [] }));
                    setChats(chats =>
                        chats.map(c => c.id === currentChat.id ? { ...c, messages: [] } : c)
                    );
                }
            };

            return (
                <>
                    {showWelcome && <WelcomeScreen onStart={handleWelcomeStart} />}
                    
                    <div className="flex h-screen">
                        <Sidebar
                            chats={chats}
                            currentChat={currentChat}
                            setCurrentChat={setCurrentChat}
                            createChat={createChat}
                            deleteChat={deleteChat}
                            isOpen={sidebarOpen}
                            setIsOpen={setSidebarOpen}
                        />

                        <div className="flex flex-col flex-1">
                            {/* Mobile header */}
                            <div className="lg:hidden flex items-center p-4 bg-white border-b">
                                <button
                                    onClick={() => setSidebarOpen(true)}
                                    className="p-2 hover:bg-gray-100 rounded"
                                >
                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" />
                                    </svg>
                                </button>
                                <h1 className="ml-3 text-lg font-semibold">RAG СПЛАВ</h1>
                            </div>

                            {currentChat ? (
                                <>
                                    <QuickActions 
                                        currentChat={currentChat}
                                        exportChat={exportChat}
                                        clearChat={clearChat}
                                    />
                                    <ChatBox 
                                        messages={currentChat.messages}
                                        onTypingComplete={(msgIndex) => {
                                            setCurrentChat(prev => {
                                                const updated = { ...prev };
                                                updated.messages[msgIndex].isNew = false;
                                                return updated;
                                            });
                                        }}
                                    />
                                    <InputBar addMessage={addMessage} currentChat={currentChat} createChat={createChat} />
                                </>
                            ) : (
                                <div className="flex-1 flex items-center justify-center text-gray-500 fade-in">
                                    <div className="text-center">
                                        <h2 className="text-2xl font-semibold mb-2">Добро пожаловать!</h2>
                                        <p className="text-gray-400">Выберите или создайте чат</p>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);

    </script>
    {% endraw %}
</body>
</html>
